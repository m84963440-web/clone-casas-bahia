<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casas Bahia | Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        
        .product-card:active { transform: scale(0.96); }
        .btn-press:active { transform: scale(0.92); }
        
        .custom-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes slideInRight {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        .animate-slide-right { animation: slideInRight 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, []);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const App = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [cart, setCart] = useState([]);
            const [activeCategory, setActiveCategory] = useState('Todos');

            const products = [
                { id: 1, name: "iPhone 15 Pro Max 256GB", price: 7499, oldPrice: 8900, category: "Smartphones", image: "https://images.pexels.com/photos/16888144/pexels-photo-16888144.jpeg?auto=compress&cs=tinysrgb&w=400", tag: "Oferta", discount: "16%" },
                { id: 2, name: "Smart TV LG OLED 65\" 4K", price: 5899, oldPrice: 7200, category: "TVs", image: "https://images.pexels.com/photos/15259088/pexels-photo-15259088.jpeg?auto=compress&cs=tinysrgb&w=400", tag: "Mais Vendido", discount: "18%" },
                { id: 3, name: "Geladeira Samsung Bespoke", price: 4200, oldPrice: 5100, category: "Geladeiras", image: "https://images.pexels.com/photos/8082207/pexels-photo-8082207.jpeg?auto=compress&cs=tinysrgb&w=400", tag: "Frete Grátis", discount: "17%" },
                { id: 4, name: "PlayStation 5 Slim", price: 3899, oldPrice: 4400, category: "Games", image: "https://images.pexels.com/photos/12019611/pexels-photo-12019611.jpeg?auto=compress&cs=tinysrgb&w=400", tag: "Estoque Baixo", discount: "11%" },
                { id: 5, name: "Lava e Seca LG AI DD 11kg", price: 4100, oldPrice: 4900, category: "Lavadoras", image: "https://images.pexels.com/photos/33686459/pexels-photo-33686459.jpeg?auto=compress&cs=tinysrgb&w=400", tag: "Melhor Preço", discount: "16%" },
                { id: 6, name: "Air Fryer Philips Walita", price: 849, oldPrice: 1100, category: "Eletro", image: "https://images.pexels.com/photos/19599329/pexels-photo-19599329.jpeg?auto=compress&cs=tinysrgb&w=400", tag: "Essencial", discount: "22%" },
            ];

            const categories = ["Todos", "Smartphones", "TVs", "Geladeiras", "Lavadoras", "Games", "Eletro"];

            const filteredProducts = useMemo(() => {
                return products.filter(p => 
                    (activeCategory === 'Todos' || p.category === activeCategory) &&
                    p.name.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }, [searchQuery, activeCategory]);

            const addToCart = (product) => {
                setCart(prev => {
                    const exists = prev.find(item => item.id === product.id);
                    if (exists) return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    return [...prev, { ...product, qty: 1 }];
                });
                setIsCartOpen(true);
            };

            const updateQty = (id, delta) => {
                setCart(prev => prev.map(item => item.id === id ? { ...item, qty: Math.max(1, item.qty + delta) } : item));
            };

            const removeItem = (id) => setCart(prev => prev.filter(item => item.id !== id));
            const cartTotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

            return (
                <div className="min-h-screen pb-20">
                    {/* Header Ultra Moderno */}
                    <header className="bg-white sticky top-0 z-40 border-b border-gray-200 px-4 py-3">
                        <div className="max-w-7xl mx-auto flex items-center gap-4">
                            <button onClick={() => setIsMenuOpen(true)} className="p-2 hover:bg-gray-100 rounded-full transition-colors btn-press">
                                <Icon name="menu" size={28} className="text-gray-800" />
                            </button>
                            
                            <div className="flex-1 relative">
                                <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none">
                                    <Icon name="search" size={18} className="text-gray-400" />
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="O que você procura hoje?" 
                                    className="w-full bg-gray-100 border-none rounded-full py-2.5 pl-10 pr-4 text-sm focus:ring-2 focus:ring-blue-600 transition-all outline-none"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                            </div>

                            <button onClick={() => setIsCartOpen(true)} className="relative p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition-all btn-press">
                                <Icon name="shopping-bag" size={24} className="text-gray-800" />
                                {cart.length > 0 && (
                                    <span className="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white">
                                        {cart.reduce((a, b) => a + b.qty, 0)}
                                    </span>
                                )}
                            </button>
                        </div>
                    </header>

                    {/* Logo Section */}
                    <div className="bg-white py-4 text-center border-b border-gray-100">
                        <h1 className="text-3xl font-black tracking-tighter text-red-600">
                            CASAS <span className="text-blue-800">BAHIA</span>
                        </h1>
                    </div>

                    {/* Categorias Horizontal */}
                    <div className="flex gap-3 overflow-x-auto no-scrollbar px-4 py-6 bg-white">
                        {categories.map(cat => (
                            <button 
                                key={cat}
                                onClick={() => setActiveCategory(cat)}
                                className={`px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all btn-press ${
                                    activeCategory === cat 
                                    ? 'bg-blue-600 text-white shadow-lg shadow-blue-200' 
                                    : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                }`}
                            >
                                {cat}
                            </button>
                        ))}
                    </div>

                    {/* Hero Banner Impactante */}
                    <div className="px-4 py-6">
                        <div className="relative h-48 md:h-80 rounded-3xl overflow-hidden custom-shadow group">
                            <img 
                                src="https://images.pexels.com/photos/16888144/pexels-photo-16888144.jpeg?auto=compress&cs=tinysrgb&w=1260" 
                                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex flex-col justify-end p-6 text-white">
                                <span className="bg-red-600 text-[10px] font-black uppercase px-2 py-1 rounded w-fit mb-2">Oferta do Dia</span>
                                <h2 className="text-2xl md:text-4xl font-black leading-tight">Semanas do <br/>Smartphone</h2>
                                <button className="mt-4 bg-white text-black px-6 py-2 rounded-full font-bold text-sm w-fit btn-press hover:bg-gray-100 transition-all">
                                    Ver Ofertas
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Grid de Produtos */}
                    <div className="px-4 py-6">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-xl font-black text-gray-900">Produtos Recomendados</h3>
                            <span className="text-xs font-bold text-blue-600 cursor-pointer hover:underline">Ver todos</span>
                        </div>
                        
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            {filteredProducts.map(product => (
                                <div key={product.id} className="bg-white rounded-3xl p-3 border border-gray-100 custom-shadow product-card transition-all hover:border-blue-200">
                                    <div className="relative aspect-square rounded-2xl overflow-hidden mb-3 bg-gray-50">
                                        <img src={product.image} className="w-full h-full object-cover" />
                                        <div className="absolute top-2 left-2 bg-white/90 backdrop-blur px-2 py-1 rounded-lg text-[10px] font-black text-red-600 shadow-sm">
                                            {product.tag}
                                        </div>
                                    </div>
                                    <p className="text-xs font-semibold text-gray-500 mb-1 truncate">{product.category}</p>
                                    <h4 className="text-sm font-bold text-gray-800 line-clamp-2 h-10 mb-2">{product.name}</h4>
                                    <div className="flex flex-col mb-4">
                                        <span className="text-[10px] text-gray-400 line-through">R$ {product.oldPrice}</span>
                                        <span className="text-lg font-black text-gray-900">R$ {product.price}</span>
                                    </div>
                                    <button 
                                        onClick={() => addToCart(product)}
                                        className="w-full py-3 bg-blue-600 text-white rounded-2xl font-bold text-xs btn-press hover:bg-blue-700 transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-100"
                                    >
                                        <Icon name="shopping-cart" size={16} /> Adicionar
                                    </button>
                                </div>
                            ))}
                        </div>
                        {filteredProducts.length === 0 && (
                            <div className="text-center py-20">
                                <Icon name="search-x" size={48} className="mx-auto text-gray-300 mb-4" />
                                <p className="text-gray-500 font-medium">Nenhum produto encontrado.</p>
                            </div>
                        )}
                    </div>

                    {/* Menu Lateral */}
                    {isMenuOpen && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm animate-fade-in">
                            <div className="w-full max-w-xs h-full bg-white animate-slide-in flex flex-col">
                                <div className="p-6 border-b flex justify-between items-center">
                                    <span className="font-black text-xl">Menu</span>
                                    <button onClick={() => setIsMenuOpen(false)} className="p-2 bg-gray-100 rounded-full btn-press">
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>
                                <div className="p-4 space-y-2 overflow-y-auto">
                                    <div className="p-4 bg-blue-50 rounded-2xl mb-6 flex items-center gap-3 cursor-pointer">
                                        <div className="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white">
                                            <Icon name="user" size={20} />
                                        </div>
                                        <div>
                                            <p className="text-xs text-blue-600 font-bold">Bem-vindo!</p>
                                            <p className="text-sm font-black">Entrar na conta</p>
                                        </div>
                                    </div>
                                    {categories.map(cat => (
                                        <button 
                                            key={cat}
                                            onClick={() => { setActiveCategory(cat); setIsMenuOpen(false); }}
                                            className="w-full text-left p-4 rounded-2xl hover:bg-gray-100 font-bold text-gray-700 transition-all flex justify-between items-center group"
                                        >
                                            {cat}
                                            <Icon name="chevron-right" size={16} className="text-gray-300 group-hover:text-blue-600" />
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Carrinho Lateral */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm">
                            <div className="absolute right-0 top-0 w-full max-w-md h-full bg-white animate-slide-right flex flex-col">
                                <div className="p-6 border-b flex justify-between items-center">
                                    <h2 className="text-xl font-black">Meu Carrinho</h2>
                                    <button onClick={() => setIsCartOpen(false)} className="p-2 bg-gray-100 rounded-full btn-press">
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-6 space-y-4">
                                    {cart.length === 0 ? (
                                        <div className="text-center py-20">
                                            <Icon name="shopping-bag" size={64} className="mx-auto text-gray-200 mb-4" />
                                            <p className="text-gray-500 font-bold">Seu carrinho está vazio</p>
                                        </div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.id} className="flex gap-4 p-4 bg-gray-50 rounded-3xl border border-gray-100">
                                                <img src={item.image} className="w-20 h-20 object-cover rounded-2xl" />
                                                <div className="flex-1">
                                                    <p className="font-bold text-sm text-gray-800 line-clamp-1">{item.name}</p>
                                                    <p className="text-blue-600 font-black text-lg">R$ {item.price}</p>
                                                    <div className="flex items-center gap-3 mt-2">
                                                        <div className="flex items-center gap-3 bg-white rounded-full border p-1">
                                                            <button onClick={() => updateQty(item.id, -1)} className="p-1 hover:bg-gray-100 rounded-full btn-press"><Icon name="minus" size={14} /></button>
                                                            <span className="text-xs font-bold w-4 text-center">{item.qty}</span>
                                                            <button onClick={() => updateQty(item.id, 1)} className="p-1 hover:bg-gray-100 rounded-full btn-press"><Icon name="plus" size={14} /></button>
                                                        </div>
                                                        <button onClick={() => removeItem(item.id)} className="text-xs text-red-500 font-bold hover:underline">Remover</button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                                {cart.length > 0 && (
                                    <div className="p-6 border-t bg-gray-50">
                                        <div className="flex justify-between items-center mb-6">
                                            <span className="text-gray-500 font-bold">Total do Pedido</span>
                                            <span className="text-2xl font-black text-gray-900">R$ {cartTotal.toLocaleString('pt-BR')}</span>
                                        </div>
                                        <button className="w-full py-4 bg-blue-600 text-white font-black rounded-2xl btn-press shadow-xl shadow-blue-200 hover:bg-blue-700 transition-all">
                                            Finalizar Compra
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
